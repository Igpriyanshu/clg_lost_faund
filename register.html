<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - College Lost & Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .card {
            background-color: #020617;
            border: 1px solid rgba(51, 65, 85, 0.5);
            padding: 32px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .text-center { text-align: center; margin-bottom: 24px; }
        .logo {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #2563eb, #6366f1);
            border-radius: 12px;
            display: flex; items-center: center; justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 20px; line-height: 48px;
        }
        h2 { margin: 0; font-size: 22px; font-weight: 700; color: #f8fafc; }
        .subtitle { font-size: 12px; color: #64748b; margin-top: 4px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; tracking-spacing: 0.05em; margin-bottom: 6px; }
        input {
            width: 100%; bg-color: rgba(15, 23, 42, 0.6);
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px; color: #e2e8f0;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #2563eb; }
        button {
            width: 100%;
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            color: white; border: none; font-weight: 700; font-size: 14px;
            padding: 12px; border-radius: 10px; cursor: pointer;
            margin-top: 12px; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .footer-text { font-size: 12px; color: #64748b; text-align: center; margin-top: 24px; }
        .footer-text a { color: #60a5fa; text-decoration: none; font-weight: 600; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="text-center">
            <div class="logo">📝</div>
            <h2>Student Registration</h2>
            <div class="subtitle">Create an account to access the campus portal</div>
        </div>

        <form action="/register" method="POST">
            <div class="form-group">
                <label>Create Username</label>
                <input type="text" name="username" required placeholder="e.g. priyanshu88">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" required placeholder="Enter mobile number">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit">Sign Up</button>
        </form>
        
        <div class="footer-text">Already registered? <a href="/">Login here</a></div>
    </div>
</body>
</html>
